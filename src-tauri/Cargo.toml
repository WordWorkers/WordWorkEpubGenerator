[package]
name = "word-work-epub"
description = "Word Work EPUB – gör e-böcker av Word Work-texter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Mikke Schirén"]
rust-version = "1.90"

[lib]
name = "word_work_epub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.6"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
regex = "1"
